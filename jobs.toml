# Backblaze B2 backup jobs.
# Each job needs: name, type ("snapshot" or "sync"), source, dest_prefix.
#   snapshot -> uploads a single file under a timestamped folder (keeps history)
#   sync     -> mirrors a directory to the bucket

[[jobs]]
name = "wodpost-db"
type = "snapshot"
source = "/opt/wodpost/database.db"
dest_prefix = "wodpost-db"

[[jobs]]
name = "wodpost-images"
type = "sync"
source = "/opt/wodpost/images/"
dest_prefix = "wodpost-images"

[[jobs]]
name = "locations-db"
type = "snapshot"
source = "/opt/locations/database.db"
dest_prefix = "locations-db"

[[jobs]]
name = "planner-db"
type = "snapshot"
source = "/opt/home-planner/planner.db"
dest_prefix = "planner-db"

